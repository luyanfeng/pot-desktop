name: Package
on:
    push:
        branches: [master]
        tags-ignore: [updater]
permissions: write-all

jobs:
    change-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.outputstep.outputs.VERSION }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git
            - id: outputstep
              run: |
                  V=$(git describe --tags 2>/dev/null | sed 's/-[0-9]*-.*//g')
                  echo "VERSION=${V:-4.0.0}" >> "$GITHUB_OUTPUT"
            - name: Change Version for Windows
              run: |
                  V=$(git describe --tags 2>/dev/null | sed 's/-[0-9]*-.*//g')
                  VERSION=${V:-4.0.0}
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\",/g" package.json

                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\",/g" src-tauri/tauri.conf.json

                  sed -i "s/^version = .*/version = \"$VERSION\"/g" src-tauri/Cargo.toml

                  echo $VERSION

            - name: Upload Artifacts for Windows
              uses: actions/upload-artifact@v4
              with:
                  name: source
                  path: ./*
                  include-hidden-files: true
                  if-no-files-found: error

    build-extension:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Build Popclipext
              run: |
                  cd .scripts/popclip
                  bash ./build.sh
                  cd ../..
            - name: Build SnipDo
              run: |
                  cd .scripts/snipdo
                  bash ./build.sh
                  cd ../..
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: Pot.popclipextz
                  path: .scripts/popclip/Pot.popclipextz
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: pot.pbar
                  path: .scripts/snipdo/pot.pbar
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: .scripts/popclip/Pot.popclipextz
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: .scripts/snipdo/pot.pbar

    build-for-macos:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest]
                target: [aarch64-apple-darwin, x86_64-apple-darwin]

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Build and Package
              run: |
                  export TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
                  export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
                  # 仅当配置了 Apple 签名 secrets 时才设置签名相关环境变量
                  # (未配置时跳过 codesign,避免 security import 空证书失败)
                  if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
                      export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
                      export APPLE_CERTIFICATE="${{ secrets.APPLE_CERTIFICATE }}"
                      export APPLE_CERTIFICATE_PASSWORD="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
                      export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
                      export APPLE_API_ISSUER="${{ secrets.APPLE_API_ISSUER }}"
                      export APPLE_API_KEY="${{ secrets.APPLE_API_KEY }}"
                      export APPLE_ID="${{ secrets.APPLE_ID }}"
                      export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
                  fi
                  pnpm tauri build --target ${{ matrix.target }}
                  sudo chmod +x src-tauri/resources/*
                  chmod +x src-tauri/resources/*
            - name: Change File Name
              if: matrix.target == 'aarch64-apple-darwin'
              run: |
                  sudo mv src-tauri/target/aarch64-apple-darwin/release/bundle/macos/newpot.app.tar.gz src-tauri/target/aarch64-apple-darwin/release/bundle/macos/newpot_${{needs.change-version.outputs.version}}_aarch64.app.tar.gz
                  sudo mv src-tauri/target/aarch64-apple-darwin/release/bundle/macos/newpot.app.tar.gz.sig src-tauri/target/aarch64-apple-darwin/release/bundle/macos/newpot_${{needs.change-version.outputs.version}}_aarch64.app.tar.gz.sig
            - name: Change File Name
              if: matrix.target == 'x86_64-apple-darwin'
              run: |
                  sudo mv src-tauri/target/x86_64-apple-darwin/release/bundle/macos/newpot.app.tar.gz src-tauri/target/x86_64-apple-darwin/release/bundle/macos/newpot_${{needs.change-version.outputs.version}}_x64.app.tar.gz
                  sudo mv src-tauri/target/x86_64-apple-darwin/release/bundle/macos/newpot.app.tar.gz.sig src-tauri/target/x86_64-apple-darwin/release/bundle/macos/newpot_${{needs.change-version.outputs.version}}_x64.app.tar.gz.sig
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_dmg
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_updater
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app*

    build-for-windows:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Build and Package
              run: |
                  $env:TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
                  $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
                  pnpm tauri build -b nsis,updater --target ${{ matrix.target }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-windows-fix-runtime:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      arch: x64
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      arch: x86
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      arch: arm64
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Download WebView2 Runtime
              run: |
                  invoke-webrequest -uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -outfile Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab
                  Expand .\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -F:* ./src-tauri
                  Remove-Item .\src-tauri\tauri.windows.conf.json
                  Rename-Item .\src-tauri\webview.${{ matrix.arch }}.json tauri.windows.conf.json
            - name: Build and Package
              run: |
                  $env:TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
                  $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
                  pnpm tauri build -b nsis,updater --target ${{ matrix.target }}
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\newpot_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.exe newpot_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.exe
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\newpot_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.nsis.zip newpot_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.nsis.zip
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\newpot_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.nsis.zip.sig newpot_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.nsis.zip.sig
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_fix_webview_runtime_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-linux:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-latest]
                target: [x86_64-unknown-linux-gnu]
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      toolchain: stable-x86_64-unknown-linux-gnu
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Build for Linux
              uses: ./.github/actions/build-for-linux
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  target: ${{ matrix.target }}
                  toolchain: ${{ matrix.toolchain }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_deb
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_rpm
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
                  if-no-files-found: error
            - name: Upload Artifacts
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_appimage
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags') && matrix.target == 'x86_64-unknown-linux-gnu'
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

    release-update:
        needs: [build-for-macos, build-for-windows, build-for-linux, build-for-windows-fix-runtime]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git curl
            - name: Get Tag Name
              run: |
                  V=$(git describe --tags 2>/dev/null | sed 's/-[0-9]*-.*//g')
                  echo "VERSION=${V:-4.0.0}" >> $GITHUB_ENV
                  echo "VERSION=${V:-4.0.0}"
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: pnpm install
              run: pnpm install
            - name: Release updater file
              run: |
                  pnpm run updater
                  pnpm run updater:fixRuntime
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Upload Release
              uses: softprops/action-gh-release@v1
              with:
                  body: ${{env.VERSION}}
                  tag_name: ${{ env.VERSION }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      update.json
                      update-fix-runtime.json

